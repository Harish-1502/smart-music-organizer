services:
  smart-music-organizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-music-organizer
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/backend/data
      - "${MUSIC_PATH:-./music}:/music:ro"
    environment:
      PYTHONUNBUFFERED: "1"
      ALLOWED_SCAN_ROOTS: '["/music"]'
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
