services:
  smart-music-organizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    container_name: smart-music-organizer
    ports:
      # Local-only by default. Use the documented LAN/mobile override only when
      # you understand this exposes the API on your network.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/backend/data
      - "${MUSIC_PATH:-./music}:/music:ro"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_LAN_MODE: "false"
      BACKEND_HOST: "127.0.0.1"
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      ALLOWED_SCAN_ROOTS: '["/music"]'
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
